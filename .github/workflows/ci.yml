name: CI
on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch: {}   # manual trigger for the live-stack e2e job
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Manual-only until the live stack is wired into CI. These Playwright specs
    # run against a LIVE backend (VITE_USE_MOCKS=false, "never against MSW"), but
    # PR runners have no backend/Postgres, so /api calls get ECONNREFUSED and the
    # specs cannot pass. Rather than fake a green check or spam red PR checks, the
    # job runs only on manual dispatch. To make it a real PR gate (Option B):
    # add a Postgres service + the hms_backend image (init.sql applied + seeded),
    # a /health readiness wait, point the Vite proxy at it, and change this `if`
    # back to run on pull_request. Do NOT switch these specs to mocks.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E Playwright tests against Live Stack
        env:
          VITE_USE_MOCKS: "false"
        run: npm run e2e
