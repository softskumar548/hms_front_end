name: CI
on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch: {}   # manual trigger for the live-stack e2e job
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_change_me
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d hms"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: softskumar548/hms_backend
          path: backend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start disposable backend stack
        env:
          PGPASSWORD: postgres_change_me
          DATABASE_URL: postgresql+asyncpg://hms_app:app_password_change_me@localhost:5432/hms
          SEED_DATABASE_URL: postgresql+asyncpg://postgres:postgres_change_me@localhost:5432/hms
          PYTHONPATH: backend/libs:backend/services/plt
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d hms -f backend/infra/postgres/init.sql
          pip install -e backend/libs/hms_tenancy -e backend/libs/hms_audit -e backend/libs/hms_auth -e "backend/services/plt[dev]"
          python -m app.seed
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          sleep 4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E Playwright tests against Live Disposable Stack
        env:
          VITE_USE_MOCKS: "false"
          VITE_API_TARGET: "http://127.0.0.1:8000"
        run: npm run e2e
