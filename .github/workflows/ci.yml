name: CI
on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch: {}   # manual trigger for the live-stack e2e job
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_change_me
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d hms"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: softskumar548/hms_backend
          path: backend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start disposable backend stack
        env:
          PGPASSWORD: postgres_change_me
          DATABASE_URL: postgresql+asyncpg://hms_app:app_password_change_me@localhost:5432/hms
          SEED_DATABASE_URL: postgresql+asyncpg://postgres:postgres_change_me@localhost:5432/hms
          PYTHONPATH: libs:services/plt
        working-directory: backend
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d hms -f infra/postgres/init.sql
          pip install -e "services/plt[dev]"
          python -m app.seed
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          sleep 5
          curl -f http://127.0.0.1:8000/health || cat uvicorn.log

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E Playwright tests against Live Disposable Stack
        env:
          VITE_USE_MOCKS: "false"
          VITE_API_TARGET: "http://127.0.0.1:8000"
        run: npm run e2e

  deploy-staging:
    name: Deploy Frontend to Staging VPS
    needs: [build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: SSH Remote Execute & Deploy Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            if [ -d "/opt/hms-web" ]; then
              cd /opt/hms-web && git pull origin main
            else
              git clone https://github.com/softskumar548/hms_front_end.git /opt/hms-web
              cd /opt/hms-web
            fi
            docker build -t hms-web:latest .
            if [ -d "/opt/hms" ]; then
              cd /opt/hms && docker compose restart nginx
            fi

